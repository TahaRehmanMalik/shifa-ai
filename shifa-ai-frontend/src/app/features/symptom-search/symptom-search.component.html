<mat-toolbar color="primary">
  <app-back-button></app-back-button>
  <span class="app-title">Symptom Search</span>
  <span class="spacer"></span>
  <app-language-switcher></app-language-switcher>
</mat-toolbar>

<main class="symptom-search-main">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="symptomForm" (ngSubmit)="onSubmit()">
        <div class="input-row">
          <mat-form-field appearance="outline" class="symptom-field">
            <mat-label>Describe your symptoms</mat-label>
            <textarea
              matInput
              rows="4"
              formControlName="symptomText"
              aria-label="Symptom description"
            ></textarea>
            @if (symptomTextControl.invalid && symptomTextControl.touched) {
              <mat-error>Please describe your symptoms in at least 3 characters.</mat-error>
            }
          </mat-form-field>

          <app-voice-input-button (transcriptRecognized)="onTranscriptRecognized($event)"></app-voice-input-button>
        </div>

        <button mat-raised-button color="primary" type="submit" [disabled]="isSubmitting()">Search</button>
      </form>

      @if (isSubmitting()) {
        <app-loading-indicator message="Analyzing your symptoms..."></app-loading-indicator>
      }

      @if (submissionError()) {
        <p class="submission-error" role="alert">{{ submissionError() }}</p>
      }
    </mat-card-content>
  </mat-card>
</main>
