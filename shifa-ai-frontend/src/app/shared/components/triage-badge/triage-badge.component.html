<div class="triage-badge" [class]="'triage-badge-' + level()" role="status">
  <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
  <span class="triage-badge-label">{{ levelLabel() }}</span>
</div>

@if (reasonLabels().length > 0) {
  <div class="triage-reasons">
    <p class="triage-reasons-title">{{ flaggedBecause() }}</p>
    <ul>
      @for (reasonLabel of reasonLabels(); track $index) {
        <li>{{ reasonLabel }}</li>
      }
    </ul>
  </div>
}
